[project]
name = "dns-traffic-analysis"
version = "0.1.0"
description = "Tools for analyzing PCAP files to identify DNS queries with high latency."
authors = [
    {name = "Michael Ragusa",email = "mragusa@infoblox.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "tqdm (>=4.67.1,<5.0.0)",
    "scapy (>=2.6.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
